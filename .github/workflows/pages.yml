name: Pages

# The web app at chiva.github.io/guoran-nixie-clock/ (Web Bluetooth needs HTTPS). Published by the
# release workflow for each release, or by hand (workflow_dispatch) to republish main.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - run: npm test
        working-directory: web
      - name: Assemble site (the app only; tests and package.json stay out)
        run: |
          mkdir -p site
          cp web/*.html web/*.js web/*.css web/*.svg web/*.webmanifest site/
          touch site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
