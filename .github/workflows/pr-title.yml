name: PR title

# pull_request, not pull_request_target: the job only reads the PR title, which a read-only
# token from a fork PR can do too, and GitHub is moving to block pull_request_target by default
# (its brownouts already make this workflow fail at startup).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
