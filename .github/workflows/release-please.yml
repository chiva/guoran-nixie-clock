name: Release

# release-please keeps one release PR open from the Conventional Commits merged into main. Merging
# it tags the release, then this same run attaches the HACS zip and publishes the web app: tags
# pushed with GITHUB_TOKEN do not trigger other workflows, so publishing cannot be tag-triggered.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # HACS installs the zip attached to the release (hacs.json: zip_release).
  zip:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Build and attach guoran_nixie.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cd custom_components/guoran_nixie
          zip -r guoran_nixie.zip . -x '*.pyc' -x '*__pycache__*'
          gh release upload "$TAG" guoran_nixie.zip --clobber

  pages:
    name: Publish web app
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
      pages: write
      id-token: write
