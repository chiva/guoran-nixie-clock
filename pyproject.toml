# Tooling for the Guoran nixie clock Home Assistant integration. This is a HACS custom integration,
# not a distributable package: its version lives in custom_components/guoran_nixie/manifest.json.
# It has no runtime requirements of its own: bleak and bleak-retry-connector ship with Home
# Assistant's bluetooth integration.
[project]
name = "guoran-nixie-clock"
version = "0.0.0"
requires-python = ">=3.15.2,<3.16"
dependencies = []

[tool.uv]
# Relative exclude-newer durations need uv 0.9.17+; older uv would misread the lock.
required-version = ">=0.9.17"
# Supply-chain cooldown: resolve only files uploaded at least 2 days ago. Renovate waits 3 days
# (minimumReleaseAge), so every version it proposes is already visible here, and the spare day
# covers wheels uploaded after a release's first file. Lock-file maintenance relies on this.
exclude-newer = "2 days"
package = false
default-groups = ["dev"]

[dependency-groups]
test = [
    # Pins Home Assistant itself (and pytest, bleak, bleak-retry-connector…) to a consistent,
    # released set.
    "pytest-homeassistant-custom-component==0.13.375",
    # The requirements of Home Assistant's bluetooth and usb integrations, which it installs on
    # demand and the test package does not: copied from their manifests in that release.
    "aiousbwatcher==1.1.2",
    "serialx==1.11.0",
    "bleak==3.0.2",
    "bleak-retry-connector==4.7.1",
    "bluetooth-adapters==2.4.0",
    "bluetooth-auto-recovery==1.6.4",
    "bluetooth-data-tools==1.29.24",
    "dbus-fast==5.0.22",
    "habluetooth==7.1.2",
]
lint = ["ruff==0.17.3"]
typing = ["mypy==2.4.1"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typing" },
    "pre-commit==4.7.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PTH", "RUF", "ASYNC", "SIM"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components"]
mypy_path = "."
explicit_package_bases = true
# Home Assistant's typing is complete enough for strict mode except for some untyped helpers.
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--tb=short"]

[tool.coverage.run]
source = ["custom_components/guoran_nixie"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
